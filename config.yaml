# Конфигурация anki_import.py / Konfiguration von anki_import.py
# Относительные пути считаются от папки, в которой лежит скрипт. / Relative Pfade werden ausgehend von dem Ordner berechnet, in dem sich das Skript befindet.
# Параметры командной строки (--deck, --file и т.д.) имеют приоритет над этим файлом. / Befehlszeilenparameter (--deck, --file usw.) haben Vorrang vor dieser Datei.

ui:
  language: "de"                            # язык сообщений в консоли / Sprache der Konsolenausgabe: ru | de

anki:
  url: "http://localhost:8765"              # адрес AnkiConnect / Die Ardesse von Anki
  deck: "Deutsch Lernen::IMPORT"            # колода (создаётся автоматически, если её нет; "::" = вложенность) / Deck (wird automatisch erstellt, falls noch nicht vorhanden; „::“ = Verschachtelung)
  model: "Basic (and reversed card)_main"   # тип заметки (создаётся автоматически, если его нет) / Notiztyp (wird automatisch erstellt, falls noch nicht vorhanden)
  timeout: 60                               # таймаут запросов к AnkiConnect, сек / Zeitlimit für Anfragen an AnkiConnect, Sek.

excel:
  file: "for_import.xlsx"               # если файла нет, он будет создан с шапкой / Wenn die Datei nicht vorhanden ist, wird sie mit einem Header erstellt
  sheet: "Sheet1"                       # лист с данными / Datenblatt

fields:
  # Поле, по которому определяются дубликаты (колонка в Excel = поле в Anki) / Feld, anhand dessen Duplikate ermittelt werden (Spalte in Excel = Feld in Anki)
  key: "base_de"
  # Обычные поля (они же колонки Excel, в этом порядке) / Normale Felder (auch bekannt als Excel-Spalten, in dieser Reihenfolge)
  base:
    - base_de
    - full_de
    - audio_text_de
    - base_tr
  #   de    - поле с немецким предложением (обязательно) / Feld mit einem deutschen Satz (erforderlich)
  #   tr    - поле с переводом (обязательно) / Feld mit der Übersetzung (erforderlich)
  #   audio - поле для [sound:...] (необязательно; без него предложение не озвучивается) / Feld für [sound:...] (optional; ohne dieses Feld wird der Satz nicht vorgelesen) 
  sentences:
    - { de: s1_de, tr: s1_tr, audio: s1_audio }
    - { de: s2_de, tr: s2_tr, audio: s2_audio }
    - { de: s3_de, tr: s3_tr, audio: s3_audio }
    - { de: s4_de, tr: s4_tr, audio: s4_audio }
    - { de: s5_de, tr: s5_tr, audio: s5_audio }
    - { de: s6_de, tr: s6_tr, audio: s6_audio }
    - { de: s7_de, tr: s7_tr, audio: s7_audio }
    - { de: s8_de, tr: s8_tr, audio: s8_audio }
    - { de: s9_de, tr: s9_tr, audio: s9_audio }

# Содержимое типа заметки. Используется ТОЛЬКО при создании типа (если его ещё нет в Anki). / Inhalt vom Typ „Notiz“. Wird NUR beim Anlegen dieses Typs verwendet (sofern er noch nicht in Anki vorhanden ist).
# Поля типа строятся автоматически: fields.base + audio.main_dest + для каждого элемента fields.sentences: de, tr и audio (если указан). /
# / Felder dieses Typs werden automatisch erstellt: fields.base + audio.main_dest + für jedes Element fields.sentences: de, tr und audio (sofern angegeben).
# Все {{поля}} из шаблонов должны быть среди этих полей, иначе скрипт остановится до создания типа. / Alle {{Felder}} aus den Vorlagen müssen unter diesen Feldern enthalten sein, andernfalls bricht das Skript ab, bevor der Typ erstellt wird.
note_type:
  css: |
    .card {
      font-family: arial;
      font-size: 20px;
      text-align: center;
    }
  cards:
    # Карточка 1: немецкий -> русский / Karte 1: Deutsch -> Russisch
    - name: "Card 1"
      front: |
        <i style="color:yellow;">{{base_de}}{{base_audio}}</i>

        <br><hr>

        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s1_de}}{{s1_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s2_de}}{{s2_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s3_de}}{{s3_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s4_de}}{{s4_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s5_de}}{{s5_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s6_de}}{{s6_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s7_de}}{{s7_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s8_de}}{{s8_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s9_de}}{{s9_audio}}</div>
      back: |
        <i style="color:yellow;">{{base_tr}}</i>
        <br><i style=color:lime;">{{full_de}}{{base_audio}}</i>

        <hr>

        <div style='font-family: Arial; font-size: 16px;'></div><br>

        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s1_de}}{{s1_audio}}{{hint:s1_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s2_de}}{{s2_audio}}{{hint:s2_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s3_de}}{{s3_audio}}{{hint:s3_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s4_de}}{{s4_audio}}{{hint:s4_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s5_de}}{{s5_audio}}{{hint:s5_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s6_de}}{{s6_audio}}{{hint:s6_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s7_de}}{{s7_audio}}{{hint:s7_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s8_de}}{{s8_audio}}{{hint:s8_tr}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s9_de}}{{s9_audio}}{{hint:s9_tr}}</div>

    # Карточка 2: русский -> немецкий (с вводом {{type:full_de}}) / Karte 2: Russisch -> Deutsch (mit Eingabe von {{type:full_de}})
    - name: "Card 2"
      front: |
        <i style=color:yellow;">{{base_tr}}{{base_audio}}</i><br>
        {{type:full_de}}
        <hr>

        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s1_tr}}{{s1_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s2_tr}}{{s2_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s3_tr}}{{s3_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s4_tr}}{{s4_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s5_tr}}{{s5_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s6_tr}}{{s6_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s7_tr}}{{s7_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s8_tr}}{{s8_audio}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s9_tr}}{{s9_audio}}</div>
      back: |
        <i style=color:lime;">{{type:full_de}}</i>
        <br><i style=color:yellow;">{{base_tr}}{{base_audio}}</i>
        <br><hr>
        <div style='font-family: Arial; font-size: 16px;'></div><br>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s1_tr}}{{s1_audio}}{{hint:s1_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s2_tr}}{{s2_audio}}{{hint:s2_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s3_tr}}{{s3_audio}}{{hint:s3_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s4_tr}}{{s4_audio}}{{hint:s4_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s5_tr}}{{s5_audio}}{{hint:s5_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s6_tr}}{{s6_audio}}{{hint:s6_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s7_tr}}{{s7_audio}}{{hint:s7_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: white;'>{{s8_tr}}{{s8_audio}}{{hint:s8_de}}</div>
        <div style='font-family: Arial; font-size: 16px; color: SkyBlue;'>{{s9_tr}}{{s9_audio}}{{hint:s9_de}}</div>

audio:
  engine: "gtts"                        # gtts | edge
  gtts_lang: "de"                       # язык для gTTS / Sprache für gTTS
  edge_voice: "de-DE-KatjaNeural"       # для edge-tts: de-DE-KatjaNeural (жен.) / de-DE-KillianNeural (муж.) / für edge-tts: de-DE-KatjaNeural (weiblich) / de-DE-KillianNeural (männlich)
  workers: 4                            # параллельных запросов к TTS / parallele Anfragen an TTS
  cache_dir: "tmp_audio"                # временная папка для .mp3 / Temporärer Ordner für .mp3-Dateien
  keep_files: false                     # true = не удалять .mp3 после выполнения / true = .mp3-Datei nach der Ausführung nicht löschen
  # Какое поле озвучиваем -> в какое кладём [sound:...] /   # Welches Feld soll vertonen werden -> in welches fügen wir [sound:...] ein
  main_source: "audio_text_de"
  main_dest: "base_audio"

retry:
  attempts: 3                           # число попыток при сетевых ошибках / Anzahl der Versuche bei Netzwerkfehlern
  delay: 2.0                            # базовая пауза между попытками, сек / Standardpause zwischen den Versuchen, Sek.
